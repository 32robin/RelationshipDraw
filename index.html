<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관계표 그리기 사이트(충북대 김병수 제작)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body, html { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background-color: #f1f5f9; font-family: sans-serif; }
        #cy { width: 100%; height: 100%; background-color: #ffffff; }
        .sidebar { z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-white border-b-2 border-slate-200 px-8 py-5 flex justify-between items-center z-20 shadow-sm">
        <div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">관계표 그리기 사이트</h1>
            <p class="text-blue-600 font-bold text-sm">(충북대 심리학과 김병수 제작)</p>
        </div>
        <button onclick="saveImage()" class="bg-slate-800 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-black transition-all shadow-md">이미지 저장</button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 bg-slate-900 p-6 flex flex-col sidebar">
            <h3 class="text-blue-400 font-bold mb-3 underline italic uppercase text-xs tracking-widest">입력페이지</h3>
            <textarea id="inputArea" class="flex-1 bg-slate-800 text-white p-4 font-mono text-base border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none leading-relaxed">독립변인 > 매개변인&#10;매개변인 > 종속변인&#10;독립변인 > 종속변인</textarea>
            <div class="mt-4 p-3 bg-slate-800/50 rounded-lg text-[11px] text-slate-400 leading-tight">
                <span class="text-blue-400 font-bold">></span> : 화살표 연결 (인과)<br/>
                <span class="text-slate-300 font-bold">-</span> : 실선 연결 (상관)<br/>
                * 오른쪽 결과창에서 도형을 마우스로 자유롭게 드래그하세요!
            </div>
        </aside>

        <main class="flex-1 relative">
            <div class="absolute top-4 left-6 z-10 text-[10px] font-black text-slate-300 uppercase tracking-widest pointer-events-none">결과페이지 (마우스 드래그 가능)</div>
            <div id="cy"></div>
        </main>
    </div>

    <script>
        let cy;

        // 관계 그리기 핵심 함수
        function renderChart() {
            const input = document.getElementById('inputArea').value;
            const lines = input.split('\n').filter(l => l.trim());
            const elements = [];
            const nodeSet = new Set();

            lines.forEach((line, i) => {
                const parts = line.split(/[>-]/);
                if (parts.length >= 2) {
                    const fromName = parts[0].trim();
                    const toName = parts[1].trim();
                    const isArrow = line.includes('>');

                    [fromName, toName].forEach(name => {
                        if (!nodeSet.has(name)) {
                            nodeSet.add(name);
                            elements.push({ data: { id: name, label: name } });
                        }
                    });

                    elements.push({
                        data: {
                            id: `e${i}`,
                            source: fromName,
                            target: toName,
                            type: isArrow ? 'triangle' : 'none'
                        }
                    });
                }
            });

            // Cytoscape 초기화 및 업데이트
            if (!cy) {
                cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: elements,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#ffffff',
                                'label': 'data(label)',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'width': '120px',
                                'height': '50px',
                                'shape': 'round-rectangle',
                                'border-width': 2,
                                'border-color': '#1e293b',
                                'font-weight': 'bold',
                                'font-size': '16px'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 3,
                                'line-color': '#334155',
                                'target-arrow-color': '#334155',
                                'target-arrow-shape': 'data(type)',
                                'curve-style': 'bezier'
                            }
                        }
                    ],
                    layout: { name: 'grid', padding: 100 }
                });
            } else {
                // 기존 위치를 유지하면서 데이터만 갱신
                const currentPositions = {};
                cy.nodes().forEach(n => { currentPositions[n.id()] = n.position(); });
                
                cy.json({ elements });
                
                cy.nodes().forEach(n => {
                    if (currentPositions[n.id()]) n.position(currentPositions[n.id()]);
                });
                
                cy.layout({ name: 'cola', animate: false, fit: true }).run(); // 가벼운 정렬
            }
        }

        // 입력창 변경 시 실시간 반영
        document.getElementById('inputArea').addEventListener('input', renderChart);

        // 이미지 저장 함수
        async function saveImage() {
            const a = document.createElement('a');
            a.download = 'research_model.jpg';
            a.href = cy.jpg({ full: true, quality: 0.9, bg: '#ffffff' });
            a.click();
        }

        // 초기 실행
        window.onload = renderChart;
    </script>
</body>
</html>
