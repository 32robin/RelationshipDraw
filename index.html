<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Mapper v7.0 (Researcher Edition)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* A4 가로 비율 캔버스 가이드 */
        #canvas-wrapper {
            width: 1050px; /* A4 비율 반영 */
            height: 742px;
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            position: relative;
            margin: 40px auto;
        }

        #cy { width: 100%; height: 100%; }

        .input-label {
            font-size: 10px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        textarea {
            transition: all 0.2s ease;
            scrollbar-width: thin;
        }
        textarea:focus {
            background-color: #ffffff !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        /* 저장 알림 */
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 14px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-size: 13px;
            font-weight: 600;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-white border-b px-8 py-4 flex justify-between items-center z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                <span class="font-black text-xl">V</span>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Vibe Mapper <span class="text-blue-600 font-black">v7.0</span></h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Psychological Research Modeling Tool</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-[11px] text-slate-400 font-medium italic bg-slate-50 px-3 py-1.5 rounded-full border">APA Guideline Optimized</span>
            <button onclick="saveJPG()" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-black transition-all text-sm active:scale-95 flex items-center gap-2">
                JPG 파일로 내보내기
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-[340px] bg-white border-r p-6 flex flex-col gap-6 overflow-y-auto shadow-sm">
            
            <div class="flex flex-col">
                <label class="input-label"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> 1. 모델 경로 (Structure)</label>
                <div class="grid grid-cols-2 gap-1 mb-2">
                    <button onclick="appendSyntax(' > ')" class="text-[10px] py-1.5 border rounded font-bold hover:bg-slate-50">인과 (실선)</button>
                    <button onclick="appendSyntax(' ..> ')" class="text-[10px] py-1.5 border rounded font-bold hover:bg-slate-50">인과 (점선)</button>
                </div>
                <textarea id="inputArea" spellcheck="false" class="w-full h-40 bg-slate-50 border-slate-200 rounded-xl p-4 font-mono text-sm outline-none resize-none" placeholder="독립변인 > 종속변인"></textarea>
            </div>

            <div class="flex flex-col">
                <label class="input-label"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> 2. 계수 입력 (Coefficients)</label>
                <p class="text-[10px] text-slate-400 mb-2 italic">상단 경로 순서대로 수치를 입력하세요.</p>
                <textarea id="coeffArea" spellcheck="false" class="w-full h-40 bg-slate-50 border-slate-200 rounded-xl p-4 font-mono text-sm outline-none resize-none text-emerald-600 font-bold" placeholder=".45*&#10;-.12&#10;.30**"></textarea>
            </div>

            <div class="mt-auto p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <h4 class="text-[11px] font-bold mb-2">Editor Tips</h4>
                <ul class="text-[10px] text-slate-500 space-y-1.5 leading-relaxed">
                    <li>• <b>새 변인:</b> 생성 시 캔버스 <b>좌측 상단</b>에 배치됩니다.</li>
                    <li>• <b>계수 표기:</b> 숫자를 입력하면 선 중앙에 나타납니다.</li>
                    <li>• <b>정렬:</b> 드래그 시 20px 그리드에 자동 스냅됩니다.</li>
                </ul>
            </div>
            
            <div class="text-center">
                <p class="text-[10px] text-slate-300 font-medium tracking-tight">Produced by Byung-su Kim, CNU</p>
            </div>
        </aside>

        <main class="flex-1 overflow-auto bg-slate-50/50 flex flex-col items-center">
            <div id="canvas-wrapper">
                <div id="cy"></div>
            </div>
        </main>
    </div>

    <div id="toast">이미지가 성공적으로 저장되었습니다!</div>

    <script>
        let cy;
        const DEFAULT_POS = { x: 100, y: 100 };

        function appendSyntax(syntax) {
            const area = document.getElementById('inputArea');
            area.value += syntax;
            area.focus();
            renderChart();
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        function renderChart() {
            const structureInput = document.getElementById('inputArea').value;
            const coeffInput = document.getElementById('coeffArea').value;
            
            const lines = structureInput.split('\n').filter(l => l.trim());
            const coeffs = coeffInput.split('\n'); // 빈 줄 포함하여 순서 매칭
            
            const elements = [];
            const nodeSet = new Set();

            // 기존 위치 보존을 위한 맵 생성
            const currentPositions = {};
            if (cy) {
                cy.nodes().forEach(n => { currentPositions[n.id()] = n.position(); });
            }

            lines.forEach((line, i) => {
                let fromName, toName, type, style;
                if (line.includes('..>')) {
                    [fromName, toName] = line.split('..>').map(s => s.trim());
                    type = 'triangle'; style = 'dashed';
                } else if (line.includes('>')) {
                    [fromName, toName] = line.split('>').map(s => s.trim());
                    type = 'triangle'; style = 'solid';
                } else if (line.includes('.-')) {
                    [fromName, toName] = line.split('.-').map(s => s.trim());
                    type = 'none'; style = 'dashed';
                } else if (line.includes('-')) {
                    [fromName, toName] = line.split('-').map(s => s.trim());
                    type = 'none'; style = 'solid';
                } else { return; }

                // 계수 값 매칭 (없으면 공백)
                const edgeLabel = coeffs[i] ? coeffs[i].trim() : '';

                [fromName, toName].forEach(name => {
                    if (name && !nodeSet.has(name)) {
                        nodeSet.add(name);
                        elements.push({ 
                            data: { id: name, label: name },
                            // 신규 변인은 왼쪽 상단에 계단식으로 생성
                            position: currentPositions[name] ? currentPositions[name] : { x: DEFAULT_POS.x, y: DEFAULT_POS.y + (nodeSet.size * 20) }
                        });
                    }
                });
                
                if (fromName && toName) {
                    elements.push({ 
                        data: { 
                            id: `e${i}`, 
                            source: fromName, 
                            target: toName, 
                            type: type, 
                            style: style,
                            label: edgeLabel // 계수 값 주입
                        } 
                    });
                }
            });

            if (!cy) {
                cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: elements,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#ffffff',
                                'label': 'data(label)',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'width': '130px',
                                'height': '54px',
                                'shape': 'rectangle',
                                'border-width': 1.5,
                                'border-color': '#1e293b',
                                'font-family': 'Pretendard',
                                'font-weight': '700',
                                'font-size': '15px',
                                'text-wrap': 'wrap',
                                'text-max-width': '110px'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 1.5,
                                'line-color': '#1e293b',
                                'target-arrow-color': '#1e293b',
                                'target-arrow-shape': 'data(type)',
                                'line-style': 'data(style)',
                                'curve-style': 'bezier',
                                'target-arrow-fill': 'filled',
                                /* 계수 텍스트 스타일 */
                                'label': 'data(label)',
                                'font-size': '13px',
                                'font-weight': '600',
                                'text-background-color': '#ffffff',
                                'text-background-opacity': 1,
                                'text-background-padding': '3px',
                                'text-margin-y': -10,
                                'edge-text-rotation': 'autorotate'
                            }
                        }
                    ],
                    layout: { name: 'preset' },
                    zoomingEnabled: true,
                    userZoomingEnabled: false, // 스크롤 줌 방지 (실수 방지)
                    panningEnabled: true,
                    boxSelectionEnabled: false
                });

                // Snap-to-Grid
                cy.on('dragfree', 'node', function(evt){
                    const node = evt.target;
                    const pos = node.position();
                    node.position({
                        x: Math.round(pos.x / 20) * 20,
                        y: Math.round(pos.y / 20) * 20
                    });
                });
            } else {
                cy.json({ elements });
            }
        }

        // 두 입력창 모두에 이벤트 리스너 추가
        document.getElementById('inputArea').addEventListener('input', renderChart);
        document.getElementById('coeffArea').addEventListener('input', renderChart);

        function saveJPG() {
            if (!cy) return;
            const a = document.createElement('a');
            a.download = `Academic_Model_${Date.now()}.jpg`;
            // A4 캔버스 전체 영역을 저장하기 위해 full: true 사용
            a.href = cy.jpg({ full: true, quality: 1, bg: '#ffffff' });
            a.click();
            showToast();
        }

        window.onload = renderChart;
    </script>
</body>
</html>
